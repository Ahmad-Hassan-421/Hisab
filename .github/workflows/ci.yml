name: Hisab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test, lint and build
        working-directory: Hisab
        run: >-
          bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
          -PHISAB_RELEASE_API_URL=https://api.example.invalid/

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check repository contents
        run: python3 scripts/check_secrets.py
      - name: Test and package backend
        working-directory: hisab-server
        run: bash ./gradlew --no-daemon test installDist
      - name: Run API regression against MongoDB
        run: |
          docker run --rm -d --name hisab-ci-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec hisab-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec hisab-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in {1..30}; do
            if docker exec hisab-ci-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then break; fi
            sleep 1
          done
          export JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export MONGO_URI='mongodb://127.0.0.1:27017/?replicaSet=rs0&serverSelectionTimeoutMS=5000'
          export MONGO_DATABASE=hisab_ci
          export HOST=127.0.0.1 PORT=18081 HISAB_ENV=production
          export UPLOAD_DIR="$RUNNER_TEMP/hisab-uploads"
          hisab-server/build/install/hisab-server/bin/hisab-server >"$RUNNER_TEMP/hisab-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; docker stop hisab-ci-mongo >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18081/healthz
          python3 scripts/qa/check_api.py --extended --port 18081
