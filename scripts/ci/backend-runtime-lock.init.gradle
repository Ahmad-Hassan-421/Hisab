import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.tasks.register('writeCiRuntimeLock') {
        doLast {
            def configuration = project.configurations.getByName('runtimeClasspath')
            // Fail on an unresolved artifact instead of silently scanning a partial graph.
            configuration.resolve()
            def modules = configuration.incoming.resolutionResult.allComponents.collect { it.id }
                .findAll { it instanceof ModuleComponentIdentifier }
                .collect { "${it.group}:${it.module}:${it.version}=runtimeClasspath" }
                .unique().sort()
            if (modules.isEmpty()) throw new GradleException('Backend runtime dependency graph is empty')
            def output = project.layout.buildDirectory.file('ci/gradle.lockfile').get().asFile
            output.parentFile.mkdirs()
            output.setText((modules + ['empty=']).join('\n') + '\n', 'UTF-8')
        }
    }
}
